[project]
name = "md2short"
version = "1.2.0"
description = "마크다운 1개를 9:16 한국어 숏폼 MP4로 변환하는 로컬 CLI"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.scripts]
md2short = "md2short.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["md2short"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "render: Remotion 실제 렌더가 필요한 테스트 (node_modules + ffmpeg 필요)",
]
